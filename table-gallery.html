<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TableGrab 表格预览与导出</title>
  <link rel="stylesheet" href="table-gallery.css">
</head>

<body>
  <!-- ======================= 顶部标题栏 ======================= -->
  <header class="app-header">
    <div class="brand">
      <img class="brand__logo" src="icons/icon48.png" alt="TableGrab" width="40" height="40">
      <div class="brand__text">
        <h1 class="brand__name">TableGrab 表格抓取</h1>
        <p class="brand__sub" id="sourceInfo">正在载入提取结果…</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn--ghost" id="btnRescan" type="button" title="重新扫描来源网页（SPA 页面内容更新后使用）">
        重新提取
      </button>
      <button class="btn btn--ghost" id="btnOpenSource" type="button" title="回到提取表格的来源网页">
        回到原网页
      </button>
      <button class="btn btn--ghost" id="btnOptions" type="button" title="打开插件设置">设置</button>
    </div>
  </header>

  <main class="app-main">
    <!-- 全局提示条：数据截断、跳过表格等说明 -->
    <div class="notice" id="noticeBar" role="status" hidden></div>

    <!-- 空状态 -->
    <section class="empty-state" id="emptyState" hidden>
      <div class="empty-state__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <path d="M3 9h18M9 3v18" />
          <path d="M14 17l5 5M19 17l-5 5" />
        </svg>
      </div>
      <h2 id="emptyTitle">没有可显示的表格</h2>
      <p id="emptyDesc">回到网页后点击右下角「提取表格」按钮，或点击工具栏中的 TableGrab 图标重新扫描。</p>
      <button class="btn btn--primary" id="btnEmptyRescan" type="button">重新提取当前网页表格</button>
    </section>

    <!-- 工具栏 -->
    <section class="toolbar" id="toolbar" hidden>
      <div class="toolbar__row">
        <label class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input type="search" id="searchInput" placeholder="搜索表格标题、行列数或单元格内容…" aria-label="搜索表格">
        </label>

        <div class="toolbar__spacer"></div>

        <div class="select-actions">
          <button class="btn btn--sm" id="btnSelectAll" type="button">全选</button>
          <button class="btn btn--sm" id="btnInvert" type="button">反选</button>
          <button class="btn btn--sm" id="btnClear" type="button">清除已选</button>
        </div>
        <span class="counter" id="counter" aria-live="polite">已选 0 / 0</span>
      </div>

      <div class="toolbar__row toolbar__row--export">
        <label class="field">
          <span class="field__label">导出格式</span>
          <select id="formatSelect">
            <option value="csv">CSV（标准逗号分隔）</option>
            <option value="csv-excel">Excel 兼容 CSV（含 BOM）</option>
            <option value="markdown">Markdown 表格</option>
            <option value="json">JSON</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">导出方式</span>
          <select id="modeSelect">
            <option value="separate">每个表格单独文件</option>
            <option value="merged">全部合并为一个文件</option>
          </select>
        </label>

        <label class="field field--check">
          <input type="checkbox" id="titlePrefix">
          <span class="field__label">文件名带网页标题前缀</span>
        </label>

        <div class="toolbar__spacer"></div>

        <button class="btn btn--primary btn--export" id="btnExport" type="button" disabled>
          导出选中（0）
        </button>
      </div>
    </section>

    <!-- 表格卡片列表 -->
    <section class="table-list" id="tableList" aria-live="polite"></section>
  </main>

  <!-- ======================= 底部状态栏 ======================= -->
  <footer class="statusbar">
    <div class="statusbar__left">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress__bar" id="progressBar"></div>
    </div>
    <button class="btn btn--ghost btn--sm" id="btnOpenFolder" type="button" title="打开浏览器默认下载目录">
      打开下载目录
    </button>
  </footer>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="lib/table-utils.js"></script>
  <script src="table-gallery.js"></script>
</body>

</html>
